name: Build Windows Portable
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    name: Build portable Windows application
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if errorlevel 1 exit /b 1
          python -m pip install -r requirements-build.txt
          if errorlevel 1 exit /b 1
      - name: Compile Python sources
        shell: cmd
        run: |
          python -m compileall -q main.py bathymetry ui tests
          if errorlevel 1 exit /b 1
      - name: Run tests
        shell: cmd
        run: |
          python -m pytest -q
          if errorlevel 1 exit /b 1
      - name: Build portable distribution
        shell: cmd
        env:
          CI: "true"
        run: |
          call build_portable.bat
          if errorlevel 1 exit /b 1
      - name: Verify build output
        shell: pwsh
        run: |
          $required = @(
            "dist/BathymetryMVP/BathymetryMVP.exe",
            "portable_release/BathymetryMVP_Portable.zip",
            "portable_release/BathymetryMVP_Portable.zip.sha256.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Required build file is missing: $path"
              exit 1
            }
          }
          $size = (
            Get-Item "portable_release/BathymetryMVP_Portable.zip"
          ).Length
          if ($size -le 0) {
            Write-Error "Portable archive is empty"
            exit 1
          }
          Write-Host "Portable archive size: $size bytes"
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: BathymetryMVP-Windows-x64-${{ github.sha }}
          path: |
            portable_release/BathymetryMVP_Portable.zip
            portable_release/BathymetryMVP_Portable.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: BathymetryMVP-Windows-x64-${{ github.sha }}
          path: release-assets
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}"
          $archive = Get-ChildItem `
            -Path release-assets `
            -Filter "*.zip" `
            -Recurse |
            Select-Object -First 1
          $checksum = Get-ChildItem `
            -Path release-assets `
            -Filter "*.sha256.txt" `
            -Recurse |
            Select-Object -First 1
          if (-not $archive) {
            Write-Error "Portable archive was not downloaded"
            exit 1
          }
          if (-not $checksum) {
            Write-Error "SHA256 checksum was not downloaded"
            exit 1
          }
          gh release create $version `
            $archive.FullName `
            $checksum.FullName `
            --repo "${{ github.repository }}" `
            --title "Bathymetry MVP $version" `
            --generate-notes