name: Build Windows Portable

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - navimetry-0.2

  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show environment
        shell: cmd
        run: |
          python --version
          pip --version
          git --version

      - name: Build portable distribution
        shell: cmd
        run: |
          set CI=true
          call build_portable.bat

      - name: Verify executable
        shell: powershell
        run: |
          $exe = "dist/Navimetry/Navimetry.exe"

          if (-not (Test-Path -LiteralPath $exe)) {
              throw "Navimetry.exe was not created"
          }

          Write-Host "Executable found:"
          Get-Item $exe | Format-List Name,Length,FullName

      - name: Verify portable archive
        shell: powershell
        run: |
          $archive = "portable_release/Navimetry_Windows_x64_Portable.zip"
          $checksum = "portable_release/Navimetry_Windows_x64_Portable.zip.sha256.txt"

          if (-not (Test-Path -LiteralPath $archive)) {
              throw "Portable ZIP was not created"
          }

          if (-not (Test-Path -LiteralPath $checksum)) {
              throw "SHA256 file was not created"
          }

          Write-Host "Portable archive:"
          Get-Item $archive | Format-List Name,Length,FullName

          Write-Host "Checksum:"
          Get-Content $checksum

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: Navimetry-Windows-x64-${{ github.sha }}
          path: |
            portable_release/Navimetry_Windows_x64_Portable.zip
            portable_release/Navimetry_Windows_x64_Portable.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: Navimetry-build-manifest-${{ github.sha }}
          path: dist/Navimetry/build_manifest.json
          if-no-files-found: error
          retention-days: 30