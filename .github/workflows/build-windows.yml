name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - navimetry-0.2
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build portable Windows application
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build portable distribution
        shell: cmd
        env:
          CI: "true"
        run: |
          call build_portable.bat
          if errorlevel 1 exit /b 1

      - name: Verify build output
        shell: pwsh
        run: |
          $required = @(
            "dist/Navimetry/Navimetry.exe",
            "dist/Navimetry/build_manifest.json",
            "portable_release/Navimetry_Windows_x64_Portable.zip",
            "portable_release/Navimetry_Windows_x64_Portable.zip.sha256.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required build file is missing: $path"
            }
          }

          $archive = Get-Item "portable_release/Navimetry_Windows_x64_Portable.zip"
          if ($archive.Length -le 0) {
            throw "Portable archive is empty"
          }
          Write-Host "Portable archive size: $($archive.Length) bytes"
          Get-Content "portable_release/Navimetry_Windows_x64_Portable.zip.sha256.txt"

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Navimetry-Windows-x64-${{ github.sha }}
          path: |
            portable_release/Navimetry_Windows_x64_Portable.zip
            portable_release/Navimetry_Windows_x64_Portable.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: Navimetry-build-manifest-${{ github.sha }}
          path: dist/Navimetry/build_manifest.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Navimetry-Windows-x64-${{ github.sha }}
          path: release-assets

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}"
          $archive = Get-ChildItem -Path release-assets -Filter "*.zip" -Recurse | Select-Object -First 1
          $checksum = Get-ChildItem -Path release-assets -Filter "*.sha256.txt" -Recurse | Select-Object -First 1
          if (-not $archive) { throw "Portable archive was not downloaded" }
          if (-not $checksum) { throw "SHA256 checksum was not downloaded" }
          gh release create $version `
            $archive.FullName `
            $checksum.FullName `
            --repo "${{ github.repository }}" `
            --title "Navimetry $version" `
            --generate-notes
